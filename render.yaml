services:
  - type: web
    name: hargeisa-iphone-center
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server/app.py
    disk:
      name: hic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HIC_DATA_DIR
        value: /var/data