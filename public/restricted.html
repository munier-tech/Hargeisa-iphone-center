<!doctype html>
<html lang="en" data-theme="midnight" data-glass="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access restricted — HARGEISA IPHONE CENTER</title>
<link rel="stylesheet" href="/assets/app.css?v=6">
<link rel="stylesheet" href="/assets/glass.css?v=1">
<script>try{if(localStorage.getItem("hic_glass")==="off")document.documentElement.dataset.glass="off"}catch(e){}</script>
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:20px}
  .box{max-width:560px;text-align:center}
  .box img{width:110px;height:110px;object-fit:contain;border-radius:26px;background:var(--panel2);padding:8px}
  .code{font-size:84px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:18px 0 6px}
  .box h1{font-size:26px;letter-spacing:1px}.box .sl{font-style:italic;color:var(--primary2);font-size:18px;margin:4px 0 22px}
</style>
</head>
<body>
<div class="box card" style="padding:38px">
  <img id="lg" alt="">
  <h1 id="cn">HARGEISA IPHONE CENTER</h1>
  <div class="sl" id="sl">Hubsiimo iyo Degdegsiimo</div>
  <div class="code" id="code">404</div>
  <h2 id="ttl">Page not found or access restricted</h2>
  <p class="muted" id="msg" style="margin:10px 0 24px">The page you are looking for does not exist, or you are not authorized to open it.</p>
  <a class="btn primary" href="/" style="text-decoration:none">Back to sign in</a>
</div>
<script>
  try { const t = localStorage.getItem('hic_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const deact = new URLSearchParams(location.search).get('reason') === 'deactivated';
  if (deact) {
    document.getElementById('code').textContent = '403';
    document.getElementById('ttl').textContent = 'Access restricted';
    document.getElementById('msg').textContent = 'Your access has been restricted; this user account has been deactivated. Please contact your owner, as you are not authorized.';
    document.title = 'Access restricted — HARGEISA IPHONE CENTER';
  }
  const dl = 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><rect x="6" y="6" width="108" height="108" rx="28" fill="url(#g)"/><rect x="38" y="20" width="44" height="80" rx="10" fill="#0b1220"/><rect x="42" y="27" width="36" height="58" rx="4" fill="#dbeafe"/><path d="M64 33 50 61h9l-3 22 15-30h-9z" fill="#2563eb"/></svg>');
  document.getElementById('lg').src = dl;
  fetch('/api.php?a=branding', { headers: { 'X-Requested-With': 'HIC' } }).then(r => r.json()).then(j => {
    if (!j.ok) return; const b = j.data;
    document.getElementById('cn').textContent = b.company_name; document.getElementById('sl').textContent = b.slogan;
    if (b.logo) document.getElementById('lg').src = b.logo;
  }).catch(() => {});
</script>
</body>
</html>
